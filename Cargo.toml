[package]
name = "swordfish-git"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Hunts secrets in git history and tells the story of each leak: when it appeared, when it was removed, and who can still reach it."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["git", "secrets", "security", "gitleaks", "audit"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "swordfish"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.88.0", default-features = false, features = ["sha1", "max-performance-safe"] }
hex = "0.4.3"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
